                    <div className="absolute inset-0 bg-teal-950/80 backdrop-blur-sm" onClick={onClose}></div>
                    <div className="bg-teal-950 w-full max-w-lg rounded-t-3xl sm:rounded-3xl overflow-hidden relative z-10 modal-enter max-h-[85vh] flex flex-col border-t-4 border-amber-400 shadow-[0_0_30px_rgba(4,47,46,0.8)]">
                        <div className="p-6 border-b border-teal-800/50 flex justify-between items-center sticky top-0 bg-teal-900/90 backdrop-blur z-10">
                            <h3 className="text-xl font-bold text-amber-400">{title}</h3>
                            <button onClick={onClose} className="p-1 text-teal-400 hover:text-amber-400 bg-teal-800/50 hover:bg-teal-800 rounded-full transition-colors"><X /></button>
                        </div>
                        <div className="p-6 overflow-y-auto">
                            {children}
                        </div>
                    </div>
                </div>
            );
        }

        function App() {
            const [view, setView] = useState('home');
            const [selectedDish, setSelectedDish] = useState(null);
            const [isIngredientsOpen, setIsIngredientsOpen] = useState(false);
            const [isStepsOpen, setIsStepsOpen] = useState(false);
            
            const [isShoppingModalOpen, setIsShoppingModalOpen] = useState(false);
            const [isEquipmentModalOpen, setIsEquipmentModalOpen] = useState(false);

            // Table State - loads from localStorage
            const [assignments, setAssignments] = useState(() => {
                const saved = localStorage.getItem('thaiShoppingAssignments');
                return saved ? JSON.parse(saved) : {};
            });

            // Save to localStorage when assignments change
            useEffect(() => {
                localStorage.setItem('thaiShoppingAssignments', JSON.stringify(assignments));
            }, [assignments]);

            const handleAssignmentChange = (item, value) => {
                setAssignments(prev => ({ ...prev, [item]: value }));
            };

            const shareToWhatsApp = () => {
                let text = "*רשימת קניות - ארוחה תאילנדית* 🇹🇭\n\n";
                fullShoppingList.forEach(group => {
                    text += `*${group.category}:*\n`;
                    group.items.forEach(item => {
                        const person = assignments[item] ? ` 👈 ${assignments[item]}` : '';
                        text += `• ${item}${person}\n`;
                    });
                    text += '\n';
                });
                
                // Copy to clipboard
                navigator.clipboard.writeText(text).then(() => {
                    alert('הרשימה המלאה והשיבוצים הועתקו! כעת אפשר להדביק בוואטסאפ של החבר\'ה.');
                });
            };

            const HomeView = () => (
                <div className="h-full flex flex-col items-center justify-center p-8 bg-teal-950 text-white text-center relative overflow-hidden">
                    <div className="absolute top-1/4 -right-10 w-72 h-72 bg-amber-500/10 rounded-full blur-[80px]"></div>
                    <div className="absolute bottom-1/4 -left-10 w-72 h-72 bg-emerald-500/10 rounded-full blur-[80px]"></div>

                    <div className="w-24 h-24 border border-amber-400/50 rounded-full flex items-center justify-center mb-8 shadow-[0_0_40px_rgba(251,191,36,0.15)] z-10 bg-teal-900/50 backdrop-blur-sm">
                        <span className="text-4xl font-thai text-amber-400">ไทย</span>
                    </div>
                    <div className="space-y-4 mb-10 z-10 w-full">
                        <h1 className="text-6xl font-bold tracking-tight font-thai text-amber-400 drop-shadow-[0_0_15px_rgba(251,191,36,0.3)]">อาหารไทย</h1>
                        <h2 className="text-3xl font-bold text-teal-50 mt-2">אוכל תאילנדי</h2>
                        <div className="h-0.5 w-16 bg-amber-500 mx-auto my-6 opacity-50"></div>
                        <p className="text-teal-100/90 text-lg font-light leading-relaxed px-4">
                            ארוחה תאילנדית מוקפדת<br />
                            ל-10 סועדים
                        </p>
                    </div>
                    
                    {/* Action Buttons */}
                    <div className="flex flex-col gap-4 items-center z-10 w-full max-w-[320px]">
                        <button 
                            onClick={() => setView('menu')}
                            className="w-full bg-amber-500 text-teal-950 px-6 py-4 rounded-2xl font-bold shadow-[0_0_30px_rgba(245,158,11,0.2)] hover:bg-amber-400 hover:shadow-[0_0_40px_rgba(245,158,11,0.4)] transition-all active:scale-95 text-lg mb-2"
                        >
                            כניסה לתפריט הארוחה
                        </button>
                        
                        <div className="flex gap-3 w-full">
                            <button 
                                onClick={() => setIsShoppingModalOpen(true)}
                                className="flex-1 bg-teal-800/60 backdrop-blur-md text-amber-400 border border-amber-400/30 py-3 rounded-2xl font-bold shadow-lg hover:bg-teal-700/60 hover:border-amber-400/60 transition-all active:scale-95 text-sm"
                            >
                                🛒 רשימת מצרכים
                            </button>
                            <button 
                                onClick={() => setIsEquipmentModalOpen(true)}
                                className="flex-1 bg-teal-800/60 backdrop-blur-md text-amber-400 border border-amber-400/30 py-3 rounded-2xl font-bold shadow-lg hover:bg-teal-700/60 hover:border-amber-400/60 transition-all active:scale-95 text-sm"
                            >
                                🔪 רשימת ציוד
                            </button>
                        </div>
                    </div>

                    <div className="absolute bottom-8 opacity-40 text-[9px] tracking-[0.4em] uppercase text-amber-400 z-10">
                        Haifa • Chef Dinner • 2026
                    </div>
                </div>
            );

            const MenuView = () => (
                <div className="h-full flex flex-col bg-teal-950 overflow-y-auto animate-fade-in">
                    <header className="p-8 bg-teal-900/50 backdrop-blur-md border-b border-teal-800/60 flex justify-between items-end sticky top-0 z-10 shadow-sm">
                        <div>
                            <h2 className="text-3xl font-bold text-amber-400 leading-none">התפריט</h2>
                            <p className="text-teal-300/60 text-[10px] mt-2 uppercase tracking-wider font-thai">เมนูอาหาร</p>
                        </div>
                        <button onClick={() => setView('home')} className="text-teal-400 hover:text-amber-400 transition-colors p-1 bg-teal-800/40 rounded-full"><ChevronLeft /></button>
                    </header>
                    <div className="p-4 space-y-4">
                        {dishes.map((dish, i) => (
                            <button 
                                key={dish.id}
                                onClick={() => { setSelectedDish(dish); setView('dish'); }}
                                className="w-full bg-teal-900/40 rounded-3xl overflow-hidden flex items-center shadow-lg p-2 border border-teal-800/50 hover:border-amber-400/50 hover:bg-teal-800/40 transition-all active:scale-[0.98] group"
                            >
                                <div className="w-28 h-28 bg-teal-950 rounded-2xl overflow-hidden shrink-0 relative flex items-center justify-center border border-teal-800/30">
                                    <img 
                                        src={dish.image} 
                                        alt={dish.title} 
                                        className="absolute inset-0 w-full h-full object-cover z-10" 
                                        onError={(e) => e.target.style.display = 'none'} 
                                    />
                                    <span className="absolute font-thai text-6xl text-teal-700 opacity-50 z-0">{dish.thai[0]}</span>
                                </div>
                                <div className="p-4 flex-grow text-right z-10">
                                    <span className="text-[10px] text-amber-500 font-bold block mb-1 uppercase tracking-tighter">{dish.type}</span>
                                    <h3 className="font-bold text-teal-50 text-lg leading-tight group-hover:text-amber-400 transition-colors">{dish.title}</h3>
                                </div>
                                <div className="p-3 text-teal-600 group-hover:text-amber-400 transition-colors z-10"><ChevronLeft /></div>
                            </button>
                        ))}
                    </div>
                </div>
            );

            const DishView = ({ dish }) => (
                <div className="h-full flex flex-col bg-teal-950 overflow-y-auto animate-fade-in pb-24">
                    <div className="relative h-96 sm:h-[28rem] shrink-0 shadow-lg bg-teal-900 flex items-center justify-center overflow-hidden border-b border-teal-800">
                        <img 
                            src={dish.image} 
                            alt={dish.title} 
                            className="absolute inset-0 w-full h-full object-cover z-0" 
                            onError={(e) => e.target.style.display = 'none'} 
                        />
                        <span className="font-thai text-[12rem] text-teal-800 opacity-30 absolute select-none whitespace-nowrap z-0">{dish.thai}</span>
                        
                        <div className="absolute inset-0 bg-gradient-to-t from-teal-950 via-teal-950/60 to-transparent z-10"></div>

                        <button 
                            onClick={() => setView('menu')}
                            className="absolute top-4 right-4 bg-teal-800/70 backdrop-blur-md text-teal-200 hover:text-amber-400 p-2 rounded-full shadow-lg z-20 transition-transform active:scale-90"
                        ><ChevronRight /></button>
                        
                        <div className="absolute bottom-0 left-0 right-0 p-6 z-20">
                            <span className="text-[10px] bg-amber-500/80 backdrop-blur border border-amber-400/40 text-teal-950 px-2.5 py-1 rounded font-bold uppercase tracking-widest inline-block mb-3">{dish.type}</span>
                            <h2 className="text-4xl text-teal-50 font-bold mb-1 leading-tight drop-shadow-md">{dish.title}</h2>
                            <p className="text-amber-400 text-lg font-thai opacity-90">{dish.thai}</p>
                        </div>
                    </div>

                    <div className="p-6 space-y-8 text-right">
                        <section>
                            <h3 className="font-bold text-amber-400 mb-3 border-b border-teal-800 pb-2 flex items-center">
                                <span className="w-1.5 h-1.5 bg-amber-400 rounded-full ml-2"></span>
                                על המנה
                            </h3>
                            <p className="text-teal-100/90 text-sm leading-relaxed font-light">{dish.description}</p>
                        </section>

                        <section className="bg-teal-900/40 p-5 rounded-2xl shadow-inner border-r-4 border-rose-500 relative overflow-hidden">
                            <div className="absolute top-0 right-0 w-full h-full bg-gradient-to-l from-rose-500/5 to-transparent pointer-events-none"></div>
                            <h4 className="font-bold text-rose-400 mb-2 text-[10px] uppercase tracking-[0.2em] flex items-center gap-2">
                                <span className="w-1.5 h-1.5 rounded-full bg-rose-500 animate-pulse"></span>
                                Master Note
                            </h4>
                            <p className="text-teal-100/80 text-xs leading-relaxed font-light relative z-10">{dish.technical}</p>
                        </section>

                        <div className="grid grid-cols-2 gap-4 pt-4">
                            <button 
                                onClick={() => setIsIngredientsOpen(true)}
                                className="group flex flex-col items-center justify-center p-5 bg-teal-900/30 border border-teal-800 rounded-3xl hover:border-amber-400/50 hover:bg-teal-800/40 active:bg-teal-900 transition-all shadow-sm active:scale-95"
                            >
                                <div className="w-12 h-12 bg-teal-950 text-amber-400 rounded-full flex items-center justify-center mb-3 border border-teal-800 group-hover:scale-110 transition-transform shadow-inner">
                                    <ListIcon />
                                </div>
                                <span className="text-xs font-bold text-teal-50">רכיבים</span>
                                <span className="text-[9px] text-teal-500/80 mt-1 uppercase tracking-tighter">10 סועדים</span>
                            </button>

                            <button 
                                onClick={() => setIsStepsOpen(true)}
                                className="group flex flex-col items-center justify-center p-5 bg-teal-900/30 border border-teal-800 rounded-3xl hover:border-rose-400/50 hover:bg-teal-800/40 active:bg-teal-900 transition-all shadow-sm active:scale-95"
                            >
                                <div className="w-12 h-12 bg-teal-950 text-rose-400 rounded-full flex items-center justify-center mb-3 border border-teal-800 group-hover:scale-110 transition-transform shadow-inner">
                                    <BookIcon />
                                </div>
                                <span className="text-xs font-bold text-teal-50">שלבי הכנה</span>
                                <span className="text-[9px] text-teal-500/80 mt-1 uppercase tracking-tighter">טכניקה</span>
                            </button>
                        </div>
                    </div>

                    <Modal 
                        isOpen={isIngredientsOpen} 
                        onClose={() => setIsIngredientsOpen(false)}
                        title={`רכיבים - ${dish.title}`}
                    >
                        <div className="space-y-4">
                            <p className="text-[10px] text-amber-400/80 font-bold uppercase tracking-widest mb-4 italic text-center bg-amber-900/20 py-2.5 rounded-lg">* כמויות מחושבות ל-10 סועדים</p>
                            <ul className="space-y-4">
                                {dish.ingredients.map((ing, i) => (
                                    <li key={i} className="flex items-start text-teal-100 text-sm group bg-teal-900/30 p-3 rounded-xl border border-teal-800/50 hover:border-amber-500/30 transition-colors">
                                        <span className="text-teal-950 font-bold text-[10px] bg-amber-400 w-5 h-5 rounded-full flex items-center justify-center shrink-0 ml-3 mt-0.5 shadow-sm">{i + 1}</span>
                                        {ing}
                                    </li>
                                ))}
                            </ul>
                        </div>
                    </Modal>

                    <Modal 
                        isOpen={isStepsOpen} 
                        onClose={() => setIsStepsOpen(false)}
                        title={`שלבי הכנה - ${dish.title}`}
                    >
                        <ul className="space-y-6">
                            {dish.steps.map((step, i) => (
                                <li key={i} className="flex items-start relative group bg-teal-900/30 p-4 rounded-xl border border-teal-800/50 hover:border-rose-500/30 transition-colors">
                                    <span className="w-7 h-7 bg-rose-600 text-white text-[10px] font-bold rounded-full flex items-center justify-center ml-4 shrink-0 shadow-md mt-0.5">
                                        {i + 1}
                                    </span>
                                    <p className="text-teal-100 text-sm leading-relaxed pt-1">{step}</p>
                                </li>
                            ))}
                        </ul>
                    </Modal>
                </div>
            );

            return (
                <div className="max-w-md mx-auto h-screen bg-teal-950 shadow-[0_0_60px_rgba(4,47,46,0.9)] relative overflow-hidden">
                    {view === 'home' && <HomeView />}
                    {view === 'menu' && <MenuView />}
                    {view === 'dish' && <DishView dish={selectedDish} />}
                    
                    {/* Shopping List Modal */}
                    <Modal 
                        isOpen={isShoppingModalOpen} 
                        onClose={() => setIsShoppingModalOpen(false)}
                        title="רשימת מצרכים ל-10 סועדים"
                    >
                        <div className="space-y-6">
                            <p className="text-teal-200 text-sm bg-teal-900/40 p-3 rounded-lg border border-teal-800/60 leading-relaxed font-light">
                                <span className="font-bold text-amber-400 ml-1">טיפ:</span> 
                                הקלד את השם בעמודת "מי מביא?". הנתונים <strong>נשמרים אוטומטית</strong> בדפדפן. בסיום לחץ על כפתור השיתוף למטה כדי להעתיק לוואטסאפ.
                            </p>

                            <div className="overflow-x-auto pb-4">
                                <table className="w-full text-right text-teal-100 border-collapse text-sm">
                                    <thead>
                                        <tr className="border-b-2 border-teal-800 text-amber-400">
                                            <th className="p-2 font-bold w-2/3">מצרך / כמות</th>
                                            <th className="p-2 font-bold w-1/3">מי מביא?</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {fullShoppingList.map((group, groupIdx) => (
                                            <React.Fragment key={groupIdx}>
                                                <tr className="bg-teal-900/50">
                                                    <td colSpan="2" className="p-2 font-bold text-rose-300 border-b border-teal-800/50 pt-4">
                                                        {group.category}
                                                    </td>
                                                </tr>
                                                {group.items.map((item, itemIdx) => (
                                                    <tr key={itemIdx} className="border-b border-teal-800/30 hover:bg-teal-900/20 transition-colors">
                                                        <td className="p-2 font-light">{item}</td>
                                                        <td className="p-1.5">
                                                            <input 
                                                                type="text" 
                                                                placeholder="הקלד שם..."
                                                                value={assignments[item] || ''}
                                                                onChange={(e) => handleAssignmentChange(item, e.target.value)}
                                                                className="w-full bg-teal-950 border border-teal-800 rounded px-2 py-1.5 text-amber-400 placeholder-teal-700 focus:outline-none focus:border-amber-400 focus:ring-1 focus:ring-amber-400 transition-all text-sm"
                                                            />
                                                        </td>
                                                    </tr>
                                                ))}
                                            </React.Fragment>
                                        ))}
                                    </tbody>
                                </table>
                            </div>

                            <button 
                                onClick={shareToWhatsApp}
                                className="w-full flex items-center justify-center gap-2 bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 px-4 rounded-xl shadow-lg transition-colors active:scale-95"
                            >
                                <ShareIcon />
                                העתק רשימה לוואטסאפ
                            </button>
                        </div>
                    </Modal>

                    {/* Equipment Modal */}
                    <Modal 
                        isOpen={isEquipmentModalOpen} 
                        onClose={() => setIsEquipmentModalOpen(false)}
                        title="ציוד טכני לארוחה"
                    >
                        <div className="space-y-6">
                            <p className="text-teal-200 text-sm font-light mb-4">
                                כלים מיוחדים הנדרשים לביצוע מדויק של הטכניקות בארוחה התאילנדית:
                            </p>
                            <ul className="text-teal-100 text-sm space-y-4 font-light">
                                <li className="flex gap-3 bg-teal-900/30 p-4 rounded-xl border border-teal-800/50">
                                    <span className="text-amber-500 mt-1">▪</span> 
                                    <span><strong className="text-amber-400 block mb-1">מכתש ועלי (רצוי מעץ)</strong> חובה לסלט הפפאיה והתירס כדי לאפשר "עיסוי" עדין של המרכיבים ולמנוע ריסוק שנוצר ממכתש אבן. משמש גם לכתישת התבלינים.</span>
                                </li>
                                <li className="flex gap-3 bg-teal-900/30 p-4 rounded-xl border border-teal-800/50">
                                    <span className="text-amber-500 mt-1">▪</span> 
                                    <span><strong className="text-amber-400 block mb-1">ווק פלדה כבד</strong> קריטי למנת הפאד קרא פאו כדי להגיע לחום אימתני (Wok Hei), וכן לטיגון העמוק של האטריות עבור הקאו סוי.</span>
                                </li>
                                <li className="flex gap-3 bg-teal-900/30 p-4 rounded-xl border border-teal-800/50">
                                    <span className="text-amber-500 mt-1">▪</span> 
                                    <span><strong className="text-amber-400 block mb-1">קולפן ג'וליאן / מגררת פפאיה תאילנדית</strong> חובה לחיתוך אחיד, דק, ארוך ומהיר של הפפאיה הירוקה.</span>
                                </li>
                                <li className="flex gap-3 bg-teal-900/30 p-4 rounded-xl border border-teal-800/50">
                                    <span className="text-amber-500 mt-1">▪</span> 
                                    <span><strong className="text-amber-400 block mb-1">בלנדר חזק או מכשיר לקרח גרוס</strong> קריטי להכנת "הר הקרח" הדק עבור קינוח הנאם קנג סאי.</span>
                                </li>
                                <li className="flex gap-3 bg-teal-900/30 p-4 rounded-xl border border-teal-800/50">
                                    <span className="text-amber-500 mt-1">▪</span> 
                                    <span><strong className="text-amber-400 block mb-1">סיר מרק גדול מאוד</strong> להרתחה והכנת ציר הדגים העמוק עבור הטום יאם פלה.</span>
                                </li>
                            </ul>
                        </div>
                    </Modal>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
